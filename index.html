<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>授業スライド一覧｜ZeroPlus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    />
    <style>
      :root {
        --orange: #ff6600;
        --text: #1e1e1e;
        --sub: #555555;
        --line: #e7e7e9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, "Noto Sans JP", sans-serif;
        color: var(--text);
        background: #fff5eb;
      }
      header {
        background: linear-gradient(135deg, #ff6600, #ffbb1f);
        color: #ffffff;
        padding: 56px 24px 64px;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
      }
      .kicker {
        font-weight: 700;
        letter-spacing: 0.16em;
        font-size: 14px;
      }
      h1 {
        margin: 12px 0 0;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.25;
      }
      main {
        padding: 40px 24px 64px;
      }
      .group-title {
        margin: 0 0 16px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--orange);
      }
      .decks {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin: 0 0 40px;
        padding: 0;
        list-style: none;
      }
      .deck {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        padding: 24px;
        background: #ffffff;
        border: 1px solid var(--line);
        border-top: 6px solid var(--orange);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(51, 51, 51, 0.06);
        color: inherit;
        text-decoration: none;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .deck:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(51, 51, 51, 0.12);
      }
      .deck .tag {
        align-self: flex-start;
        padding: 4px 12px;
        border-radius: 999px;
        background: #fff5eb;
        color: #c24e00;
        font-size: 13px;
        font-weight: 700;
      }
      .deck h2 {
        margin: 4px 0 0;
        font-size: 22px;
      }
      .deck p {
        margin: 0;
        color: var(--sub);
        font-size: 14px;
        line-height: 1.7;
      }
      .deck .meta {
        margin-top: auto;
        padding-top: 8px;
        color: #777777;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="kicker">ZeroPlus</div>
        <h1>授業スライド一覧</h1>
      </div>
    </header>
    <main>
      <div class="wrap">
        <!--
          資料を追加するときは、下の <li> を1つコピーして書き換える。
          href はフォルダ名に合わせる（例: ts01/）。
          新しいコースなら group-title と ul をまとめて増やす。
        -->
        <h2 class="group-title">REACT</h2>
        <ul class="decks">
          <li>
            <a class="deck" href="react02/">
              <span class="tag">React 02</span>
              <h2>カレンダーアプリ</h2>
              <p>
                json-server で API を用意し、予定の取得・追加・編集・削除を実装する
              </p>
              <span class="meta">105 枚</span>
            </a>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
